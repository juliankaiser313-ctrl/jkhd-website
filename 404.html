<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — JKHD</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; }
    body.holding { display: flex; flex-direction: column; background: var(--dark-bg); }
    .holding-hero { flex: 1; display: flex; align-items: center; position: relative; overflow: hidden; }
    .holding-inner { text-align: center; margin: 0 auto; padding: 60px 28px; position: relative; z-index: 1; max-width: 720px; }
    .holding-mark { width: 64px; height: 64px; fill: var(--dark-text); margin: 0 auto 30px; display: block; }
    .holding-title { font-family: var(--serif); font-size: clamp(1.6rem, 3.4vw, 2.4rem); color: var(--dark-text); }
    .holding-sub { margin-top: 18px; color: var(--dark-muted); }
    .holding-actions { margin-top: 36px; }
    .holding-footer { border-top: 1px solid var(--dark-border); padding: 22px 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .holding-footer span { color: var(--dark-muted); font-size: 0.78rem; }
    .holding-footer nav { display: flex; gap: 24px; }
    .holding-footer a { color: var(--dark-muted); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  </style>
</head>
<body class="holding band-dark">

  <main class="holding-hero">
    <div class="mark-watermark" aria-hidden="true" style="top:0; right:-6%; height:100%; aspect-ratio:1;">
      <svg viewBox="0 0 100 100"><rect x="10" y="22" width="20" height="56"/><rect x="40" y="8" width="20" height="84"/><rect x="70" y="22" width="20" height="56"/></svg>
    </div>
    <div class="holding-inner">
      <svg class="holding-mark" viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="20" height="56"/><rect x="40" y="8" width="20" height="84"/><rect x="70" y="22" width="20" height="56"/></svg>
      <h1 class="holding-title">Diese Seite existiert nicht.</h1>
      <p class="holding-sub">Fehler 404 — die angeforderte Adresse wurde nicht gefunden.</p>
      <div class="holding-actions">
        <a href="index.html" class="btn btn-primary">Zur Startseite</a>
      </div>
    </div>
  </main>

  <footer class="holding-footer">
    <span>© <span id="year">2026</span> JKHD — jkhd.de</span>
    <nav aria-label="Rechtliches">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </nav>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
