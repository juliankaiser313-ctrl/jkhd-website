<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JKHD — Quantitative Systeme &amp; Software</title>
  <meta name="description" content="JKHD entwickelt und betreibt quantitative Handelssysteme. Die vollständige Website befindet sich im Aufbau.">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JKHD">
  <meta property="og:title" content="JKHD — Quantitative Systeme &amp; Software">
  <meta property="og:description" content="Unabhängiges Quant-Projekt aus Deutschland. Die vollständige Website befindet sich im Aufbau.">
  <meta property="og:image" content="https://www.jkhd.de/assets/og-image.png">
  <meta property="og:url" content="https://www.jkhd.de/">
  <link rel="canonical" href="https://www.jkhd.de/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "JKHD",
    "url": "https://www.jkhd.de",
    "email": "info@jkhd.de",
    "description": "JKHD entwickelt und betreibt quantitative Handelssysteme — mit ehrlicher Statistik, betrieben rund um die Uhr.",
    "founder": { "@type": "Person", "name": "Julian Kaiser" }
  }
  </script>
  <style>
    html, body { height: 100%; }
    body.holding { display: flex; flex-direction: column; background: var(--dark-bg); }
    .holding-hero { flex: 1; display: flex; align-items: center; position: relative; overflow: hidden; }
    .holding-inner { text-align: center; margin: 0 auto; padding: 60px 28px; position: relative; z-index: 1; max-width: 760px; }
    .holding-mark { width: 76px; height: 76px; fill: var(--dark-text); margin: 0 auto 34px; display: block; }
    .holding-word { font-weight: 800; font-size: 1.5rem; letter-spacing: 0.5em; color: var(--dark-text); transform: translateX(0.25em); margin-bottom: 30px; }
    .holding-line { width: 56px; height: 1px; background: var(--dark-text); opacity: 0.5; margin: 0 auto 30px; }
    .holding-title { font-family: var(--serif); font-size: clamp(1.5rem, 3.4vw, 2.2rem); color: var(--dark-text); line-height: 1.35; }
    .holding-sub { margin-top: 22px; color: var(--dark-muted); font-size: 1.02rem; }
    .holding-actions { margin-top: 40px; }
    .holding-status { justify-content: center; margin-top: 44px; }
    .holding-footer { border-top: 1px solid var(--dark-border); padding: 22px 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; position: relative; z-index: 1; }
    .holding-footer span { color: var(--dark-muted); font-size: 0.78rem; }
    .holding-footer nav { display: flex; gap: 24px; }
    .holding-footer a { color: var(--dark-muted); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
    .holding-footer a:hover { color: var(--dark-text); opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .holding-inner > * { opacity: 0; transform: translateY(18px); animation: fadeUp 0.9s var(--ease) forwards; }
      .holding-inner > *:nth-child(2) { animation-delay: 0.08s; }
      .holding-inner > *:nth-child(3) { animation-delay: 0.16s; }
      .holding-inner > *:nth-child(4) { animation-delay: 0.24s; }
      .holding-inner > *:nth-child(5) { animation-delay: 0.32s; }
      .holding-inner > *:nth-child(6) { animation-delay: 0.4s; }
      .holding-inner > *:nth-child(7) { animation-delay: 0.5s; }
    }
  </style>
</head>
<body class="holding band-dark">

  <main class="holding-hero">
    <canvas id="dataviz" class="hero-canvas" aria-hidden="true"></canvas>
    <div class="mark-watermark" aria-hidden="true" style="top:0; right:-6%; height:100%; aspect-ratio:1;">
      <svg viewBox="0 0 100 100"><rect x="10" y="22" width="20" height="56"/><rect x="40" y="8" width="20" height="84"/><rect x="70" y="22" width="20" height="56"/></svg>
    </div>
    <div class="holding-inner">
      <svg class="holding-mark" viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="20" height="56"/><rect x="40" y="8" width="20" height="84"/><rect x="70" y="22" width="20" height="56"/></svg>
      <div class="holding-word">JKHD</div>
      <div class="holding-line" aria-hidden="true"></div>
      <h1 class="holding-title">Quantitative Systeme. Software. Automatisierung.</h1>
      <p class="holding-sub">
        Die vollständige Website befindet sich im Aufbau.
        Für Anfragen erreichen Sie uns bereits per E-Mail.
      </p>
      <div class="holding-actions">
        <a href="mailto:kontakt@jkhd.de" class="btn btn-primary">kontakt@jkhd.de</a>
      </div>
      <p class="hero-status holding-status"><span class="live-dot"></span> System aktiv &nbsp;·&nbsp; Überwachung 24/7</p>
    </div>
  </main>

  <footer class="holding-footer">
    <span>© <span id="year">2026</span> JKHD — jkhd.de</span>
    <nav aria-label="Rechtliches">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </nav>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
